---
- name: Validate ansible-tui execution path
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    marker_file: /tmp/ansible_tui_validation_marker
  tasks:
    - name: Print run context
      ansible.builtin.debug:
        msg:
          - "Hello from ansible-tui"
          - "Host={{ inventory_hostname }}"
          - "Check mode={{ ansible_check_mode }}"

    - name: Run ping
      ansible.builtin.ping:
