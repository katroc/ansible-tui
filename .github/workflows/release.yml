name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  BIN_NAME: ansible-tui
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: .tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: .tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            archive_ext: .tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: .tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: .zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build output
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Set artifact basename
        shell: bash
        run: |
          echo "ASSET_BASENAME=${BIN_NAME}-${VERSION}-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C "target/${{ matrix.target }}/release" -czf "${ASSET_BASENAME}${{ matrix.archive_ext }}" "${BIN_NAME}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${env:BIN_NAME}.exe" -DestinationPath "${env:ASSET_BASENAME}${{ matrix.archive_ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET_BASENAME }}${{ matrix.archive_ext }}

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
